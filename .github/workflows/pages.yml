name: Check blog and optionally deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy to Pages only when the repository plan supports it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
      - run: npm ci
      - run: npm run build && npm run check
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
